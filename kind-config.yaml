kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mediq
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30090
        hostPort: 8090
        protocol: TCP
      - containerPort: 30086
        hostPort: 16686
        protocol: TCP
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
  - role: worker
  - role: worker
