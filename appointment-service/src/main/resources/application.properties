server.port=8084
spring.application.name=appointment-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediq_appointments}
spring.datasource.username=${DB_USERNAME:mediq}
spring.datasource.password=${DB_PASSWORD:mediq}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=mediq_appointments
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.scheduling.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=appointment-service
# ── Distributed Tracing ───────────────────────────────────────────────────────
management.otlp.tracing.endpoint=${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
# ── Temporal ──────────────────────────────────────────────────────────────────
temporal.host=${TEMPORAL_HOST:localhost}
temporal.port=${TEMPORAL_PORT:7233}
temporal.namespace=mediq-appointments
temporal.task-queue=appointment-booking-queue
mediq.payment-service.url=${PAYMENT_SERVICE_URL:http://payment-service:8089}
mediq.notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
mediq.kafka.topic.user-events=mediq.user.events
mediq.kafka.topic.doctor-events=mediq.doctor.events
mediq.kafka.topic.appointment-events=mediq.appointment.events
logging.level.com.mediq=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
