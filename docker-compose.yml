networks:
  mediq-net:
    driver: bridge

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mediq-postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "wal_keep_size=1024"
    environment:
      POSTGRES_USER: mediq
      POSTGRES_PASSWORD: mediq
      POSTGRES_DB: mediq_users
    ports:
      - "5432:5432"
    volumes:
      - D:/codebase/docker-mounts/postgres:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediq -d mediq_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mediq-redis
    ports:
      - "6379:6379"
    volumes:
      - D:/codebase/docker-mounts/redis:/data
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mediq-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep -q 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mediq-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - D:/codebase/docker-mounts/kafka:/var/lib/kafka/data
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Debezium Kafka Connect — one instance per outbox-publishing service ───────
  # EMR excluded: uses event-sourcing internally, never publishes to Kafka.
  mediq-user-connect:
    image: quay.io/debezium/connect:2.7
    container_name: mediq-user-connect
    ports:
      - "8091:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mediq-user-connect-group
      CONFIG_STORAGE_TOPIC: mediq.connect.user.configs
      OFFSET_STORAGE_TOPIC: mediq.connect.user.offsets
      STATUS_STORAGE_TOPIC: mediq.connect.user.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    networks:
      - mediq-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mediq-appointment-connect:
    image: quay.io/debezium/connect:2.7
    container_name: mediq-appointment-connect
    ports:
      - "8092:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mediq-appointment-connect-group
      CONFIG_STORAGE_TOPIC: mediq.connect.appointment.configs
      OFFSET_STORAGE_TOPIC: mediq.connect.appointment.offsets
      STATUS_STORAGE_TOPIC: mediq.connect.appointment.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    networks:
      - mediq-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mediq-doctor-connect:
    image: quay.io/debezium/connect:2.7
    container_name: mediq-doctor-connect
    ports:
      - "8094:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mediq-doctor-connect-group
      CONFIG_STORAGE_TOPIC: mediq.connect.doctor.configs
      OFFSET_STORAGE_TOPIC: mediq.connect.doctor.offsets
      STATUS_STORAGE_TOPIC: mediq.connect.doctor.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    networks:
      - mediq-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mediq-payment-connect:
    image: quay.io/debezium/connect:2.7
    container_name: mediq-payment-connect
    ports:
      - "8093:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: mediq-payment-connect-group
      CONFIG_STORAGE_TOPIC: mediq.connect.payment.configs
      OFFSET_STORAGE_TOPIC: mediq.connect.payment.offsets
      STATUS_STORAGE_TOPIC: mediq.connect.payment.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    networks:
      - mediq-net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Connector registration (runs once, exits after registering all connectors) ─
  connector-init:
    image: curlimages/curl:8.7.1
    container_name: mediq-connector-init
    volumes:
      - ./scripts/register-connectors.sh:/scripts/register-connectors.sh:ro
    command: ["/bin/sh", "/scripts/register-connectors.sh"]
    networks:
      - mediq-net
    depends_on:
      mediq-user-connect:
        condition: service_healthy
      mediq-appointment-connect:
        condition: service_healthy
      mediq-doctor-connect:
        condition: service_healthy
      mediq-payment-connect:
        condition: service_healthy
    restart: "no"

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: mediq-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - D:/codebase/docker-mounts/keycloak:/opt/keycloak/data
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak-user-spi/target/keycloak-user-spi-1.0.0-shaded.jar:/opt/keycloak/providers/keycloak-user-spi.jar:ro
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD", "/bin/bash", "-c",
             "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /realms/mediq HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | head -1 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── Jaeger — distributed tracing UI ─────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: mediq-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - mediq-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Temporal Server ──────────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: mediq-temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: mediq
      POSTGRES_PWD: mediq
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "tctl --address $(hostname -i):7233 cluster health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── Temporal Web UI ──────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: mediq-temporal-ui
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    networks:
      - mediq-net
    depends_on:
      temporal:
        condition: service_healthy

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mediq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - D:/codebase/docker-mounts/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - mediq-net

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: mediq-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: mediq
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - D:/codebase/docker-mounts/grafana:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - mediq-net
    depends_on:
      - prometheus

  # ── Loki ─────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.6
    container_name: mediq-loki
    ports:
      - "3100:3100"
    volumes:
      - D:/codebase/docker-mounts/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - mediq-net

  # ── Promtail ─────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.6
    container_name: mediq-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - mediq-net
    depends_on:
      - loki

  # ── user-service ─────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: mediq-user-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_users
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_ADMIN_URL: http://keycloak:8090
      KEYCLOAK_ADMIN_SECRET: admin
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── doctor-service ───────────────────────────────────────────────────────────
  doctor-service:
    build:
      context: ./doctor-service
      dockerfile: Dockerfile
    container_name: mediq-doctor-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_doctors
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── appointment-service ──────────────────────────────────────────────────────
  appointment-service:
    build:
      context: ./appointment-service
      dockerfile: Dockerfile
    container_name: mediq-appointment-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_appointments
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8084/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── payment-service ──────────────────────────────────────────────────────────
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: mediq-payment-service
    ports:
      - "8089:8089"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_payments
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      TEMPORAL_HOST: temporal
      TEMPORAL_PORT: 7233
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8089/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── notification-service ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: mediq-notification-service
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_notifications
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8085/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── emr-service ──────────────────────────────────────────────────────────────
  emr-service:
    build:
      context: ./emr-service
      dockerfile: Dockerfile
    container_name: mediq-emr-service
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_emr
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8086/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── analytics-service ────────────────────────────────────────────────────────
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: mediq-analytics-service
    ports:
      - "8087:8087"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mediq_analytics
      DB_USERNAME: mediq
      DB_PASSWORD: mediq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
    networks:
      - mediq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8087/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── KrakenD API Gateway ──────────────────────────────────────────────────────
  krakend:
    image: devopsfaith/krakend:2.7
    container_name: mediq-krakend
    ports:
      - "8080:8080"
    volumes:
      - ./krakend:/etc/krakend
    environment:
      FC_ENABLE: "1"
      FC_TEMPLATES: "/etc/krakend/partials"
      FC_SETTINGS: "/etc/krakend/settings"
      JAEGER_HOST: "jaeger"
    command: ["run", "--config", "/etc/krakend/krakend.tmpl", "--debug"]
    networks:
      - mediq-net
    depends_on:
      keycloak:
        condition: service_healthy
      user-service:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediq-frontend
    ports:
      - "4200:80"
    networks:
      - mediq-net
    depends_on:
      - krakend
