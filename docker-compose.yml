version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  TrueCare — Step 4 Local Auth Setup
#
#  Ports:
#    8090 → Keycloak Admin UI  (replaces AWS Cognito locally)
#    8080 → KrakenD API Gateway
#    8081 → patient-service
#    8082 → referral-service
#
#  Keycloak replaces Cognito for local development.
#  From KrakenD's perspective ONLY the jwk_url changes:
#    Cognito : https://cognito-idp.region.amazonaws.com/poolId/.well-known/jwks.json
#    Keycloak: http://keycloak:8090/realms/trucare/protocol/openid-connect/certs
#
#  Everything else (alg, propagate_claims, roles) stays identical.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  trucare-net:
    driver: bridge

services:

  # ── Keycloak — Local Identity Provider (replaces AWS Cognito) ───────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command:
      - start-dev
      - --import-realm          # auto-imports trucare-realm.json on first start
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8090:8090"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import  # realm JSON auto-imported
    networks:
      - trucare-net
    healthcheck:
      test: ["CMD", "/bin/bash", "-c",
             "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /realms/trucare HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | head -1 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s    # Keycloak takes ~60-80s on first start with realm import

  # ── Patient Service (Spring Boot, Java 17) ──────────────────────────────────
  patient-service:
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    container_name: patient-service
    ports:
      - "8081:8081"
    networks:
      - trucare-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Referral Service (Spring Boot, Java 17) ─────────────────────────────────
  referral-service:
    build:
      context: ./referral-service
      dockerfile: Dockerfile
    container_name: referral-service
    ports:
      - "8082:8082"
    networks:
      - trucare-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      keycloak:
        condition: service_healthy

  # ── KrakenD API Gateway ─────────────────────────────────────────────────────
  krakend:
    image: devopsfaith/krakend:2.7
    container_name: krakend
    ports:
      - "8080:8080"
    volumes:
      - ./krakend:/etc/krakend
    environment:
      FC_ENABLE: "1"
      FC_TEMPLATES: "/etc/krakend/partials"
      FC_SETTINGS: "/etc/krakend/settings"
    command: ["run", "--config", "/etc/krakend/krakend.tmpl", "--debug"]
    networks:
      - trucare-net
    depends_on:
      keycloak:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      referral-service:
        condition: service_healthy
