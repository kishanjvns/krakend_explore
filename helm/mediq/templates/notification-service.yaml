apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mediq.labels" (merge (dict "name" "notification-service") .) | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicas }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: {{ include "mediq.image" (merge (dict "name" "notification-service") .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
---
# KEDA ScaledObject — scales by Kafka lag, not CPU
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-scaler
  namespace: {{ .Values.global.namespace }}
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: {{ .Values.notificationService.keda.minReplicas }}
  maxReplicaCount: {{ .Values.notificationService.keda.maxReplicas }}
  cooldownPeriod: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-service:9092
        consumerGroup: mediq-notification-appointment-group
        topic: mediq.appointment.events
        lagThreshold: "{{ .Values.notificationService.keda.lagThreshold }}"
        offsetResetPolicy: latest
