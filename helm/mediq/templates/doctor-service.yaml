apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mediq.labels" (merge (dict "name" "doctor-service") .) | nindent 4 }}
spec:
  replicas: {{ .Values.doctorService.replicas }}
  selector:
    matchLabels:
      app: doctor-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: {{ include "mediq.image" (merge (dict "name" "doctor-service") .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.doctorService.port }}
          resources:
            {{- toYaml .Values.doctorService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.doctorService.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.doctorService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.doctorService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: ClusterIP
  selector:
    app: doctor-service
  ports:
    - port: {{ .Values.doctorService.port }}
      targetPort: {{ .Values.doctorService.port }}
