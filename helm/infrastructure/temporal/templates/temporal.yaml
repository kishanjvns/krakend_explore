{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: mediq
  labels:
    app: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
    spec:
      containers:
        - name: temporal
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: DB
              value: postgresql
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: mediq
            - name: POSTGRES_PWD
              value: mediq
            - name: POSTGRES_SEEDS
              value: mediq-postgres
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-service
  namespace: mediq
spec:
  type: ClusterIP
  selector:
    app: temporal
  ports:
    - name: grpc
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: mediq
  labels:
    app: temporal-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      containers:
        - name: temporal-ui
          image: {{ .Values.uiImage }}
          ports:
            - containerPort: {{ .Values.uiPort }}
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-service:{{ .Values.port }}
            - name: TEMPORAL_CORS_ORIGINS
              value: "*"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.uiPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui-service
  namespace: mediq
spec:
  type: NodePort
  selector:
    app: temporal-ui
  ports:
    - port: {{ .Values.uiPort }}
      targetPort: {{ .Values.uiPort }}
      nodePort: {{ .Values.uiNodePort }}
{{- end }}
