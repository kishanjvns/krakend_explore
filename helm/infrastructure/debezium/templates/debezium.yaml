apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: {{ .Release.Namespace }}
  labels:
    app: debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium
  template:
    metadata:
      labels:
        app: debezium
    spec:
      containers:
        - name: debezium
          image: {{ .Values.image }}
          command: ["/bin/bash", "/scripts/start.sh"]
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers }}
            - name: GROUP_ID
              value: mediq-debezium-connect
            - name: CONFIG_STORAGE_TOPIC
              value: debezium.configs
            - name: OFFSET_STORAGE_TOPIC
              value: debezium.offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium.status
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: connectors
              mountPath: /connectors
          readinessProbe:
            httpGet:
              path: /connectors
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /connectors
              port: {{ .Values.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
      volumes:
        - name: scripts
          configMap:
            name: debezium-scripts
            defaultMode: 0755
        - name: connectors
          configMap:
            name: debezium-connectors
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: debezium
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
