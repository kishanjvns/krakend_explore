apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-scripts
  namespace: {{ .Release.Namespace }}
data:
  start.sh: |
    #!/bin/bash
    set -e

    echo "Starting Kafka Connect..."
    /docker-entrypoint.sh start &
    CONNECT_PID=$!

    echo "Waiting for Kafka Connect REST API on port {{ .Values.port }}..."
    until curl -sf http://localhost:{{ .Values.port }}/connectors > /dev/null 2>&1; do
      sleep 5
    done
    echo "Kafka Connect is ready."

    register_connector() {
      local name=$1
      local file=$2
      local status
      status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:{{ .Values.port }}/connectors/"$name")
      if [ "$status" = "200" ]; then
        echo "Connector $name already registered — skipping."
      else
        echo "Registering connector: $name"
        curl -sf -X POST http://localhost:{{ .Values.port }}/connectors \
          -H 'Content-Type: application/json' \
          -d @"$file" \
          && echo "OK: $name registered." \
          || echo "WARNING: failed to register $name — will retry on next restart."
      fi
    }

    register_connector "user-outbox-connector"        "/connectors/user-outbox-connector.json"
    register_connector "appointment-outbox-connector" "/connectors/appointment-outbox-connector.json"
    register_connector "doctor-outbox-connector"      "/connectors/doctor-outbox-connector.json"
    register_connector "emr-outbox-connector"         "/connectors/emr-outbox-connector.json"
    register_connector "payment-outbox-connector"     "/connectors/payment-outbox-connector.json"

    echo "All connectors processed. Kafka Connect running (PID $CONNECT_PID)."
    wait $CONNECT_PID
---
apiVersion: v1
