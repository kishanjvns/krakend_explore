apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: mediq
  labels:
    app: zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: {{ .Values.port | quote }}
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          readinessProbe:
            exec:
              command: ["bash", "-c", "echo ruok | nc localhost {{ .Values.port }} | grep imok"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: mediq
spec:
  type: ClusterIP
  selector:
    app: zookeeper
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
