{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.uiPort }}
            - containerPort: {{ .Values.otlpGrpcPort }}
            - containerPort: {{ .Values.otlpHttpPort }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.uiPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: {{ .Values.uiPort }}
      targetPort: {{ .Values.uiPort }}
      nodePort: {{ .Values.nodePort }}
    - name: otlp-grpc
      port: {{ .Values.otlpGrpcPort }}
      targetPort: {{ .Values.otlpGrpcPort }}
    - name: otlp-http
      port: {{ .Values.otlpHttpPort }}
      targetPort: {{ .Values.otlpHttpPort }}
{{- end }}
