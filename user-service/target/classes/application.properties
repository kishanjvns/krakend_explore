#  Server 
server.port=8081
spring.application.name=user-service

#  Database 
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediq_users}
spring.datasource.username=${DB_USERNAME:mediq}
spring.datasource.password=${DB_PASSWORD:mediq}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

#  JPA 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#  Flyway 
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=mediq_users

#  Kafka 
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

#  Redis 
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

#  Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,liveness,readiness
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true
management.endpoint.health.probes.enabled=true

# Health probe groups
management.endpoint.health.group.liveness.include=livenessState,database
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.include=readinessState,database,redis,kafka
management.endpoint.health.group.readiness.show-details=always

# Prometheus metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=user-service
management.metrics.tags.environment=${ENVIRONMENT:local}

# ── Distributed Tracing ───────────────────────────────────────────────────────
management.otlp.tracing.endpoint=${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Scheduling (for outbox relay)
spring.scheduling.enabled=true

#  Jackson 
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

#  Logging 
logging.level.com.mediq=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

#  Security (disabled — KrakenD handles auth at gateway) 
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#  App custom config 
mediq.kafka.topic.user-events=mediq.user.events
mediq.cache.user.ttl-minutes=30
mediq.keycloak.admin-url=${KEYCLOAK_ADMIN_URL:http://localhost:8090}
mediq.keycloak.realm=mediq
mediq.keycloak.admin-client-id=mediq-admin-cli
mediq.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_SECRET:admin-secret}
