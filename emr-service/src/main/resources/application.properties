spring.application.name=emr-service
server.port=8086

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediq_emr}
spring.datasource.username=${DB_USERNAME:mediq}
spring.datasource.password=${DB_PASSWORD:mediq}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mediq_emr
spring.flyway.schemas=mediq_emr
spring.flyway.default-schema=mediq_emr

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=mediq-emr-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true

# Tracing
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
spring.application.name=emr-service

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
