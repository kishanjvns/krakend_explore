spring.application.name=analytics-service
server.port=8087

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediq_analytics}
spring.datasource.username=${DB_USERNAME:mediq}
spring.datasource.password=${DB_PASSWORD:mediq}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mediq_analytics
spring.flyway.schemas=mediq_analytics
spring.flyway.default-schema=mediq_analytics

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=mediq-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Redis (for JTI blacklist check in KrakenDAuthFilter)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true

# ── Distributed Tracing ───────────────────────────────────────────────────────
management.otlp.tracing.endpoint=${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
