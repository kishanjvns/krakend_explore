server.port=8085
spring.application.name=notification-service

# Redis (for JTI blacklist check in KrakenDAuthFilter)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mediq_notifications}
spring.datasource.username=${DB_USERNAME:mediq}
spring.datasource.password=${DB_PASSWORD:mediq}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=mediq_notifications

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=manual
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Security handled by KrakenDAuthFilter

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=notification-service
# ── Distributed Tracing ───────────────────────────────────────────────────────
management.otlp.tracing.endpoint=${JAEGER_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=W3C

# Kafka topics
mediq.kafka.topic.user-events=mediq.user.events
mediq.kafka.topic.appointment-events=mediq.appointment.events
mediq.kafka.topic.payment-events=mediq.payment.events
mediq.kafka.topic.otp-events=mediq.otp.events

# ── Email (Mailtrap SMTP sandbox) ─────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:c08b98ac63c238}
spring.mail.password=${MAIL_PASSWORD:dac5bf469f22ae}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.default-encoding=UTF-8

# ── Notification Strategy ─────────────────────────────────────────────────────
mediq.notification.otp-strategy=static
mediq.notification.email-strategy=mailtrap
mediq.notification.sms-strategy=static
mediq.notification.from-email=noreply@mediq.com
mediq.notification.from-name=mediq Healthcare

# Logging
logging.level.com.mediq=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
